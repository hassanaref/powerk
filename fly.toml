app = "powerk"
primary_region = "iad"

[build]

# 1. Raw TCP for the smart strip hardware
[[services]]
  internal_port = 10086
  protocol = "tcp"

  [[services.ports]]
    port = 10086

# 2. HTTP Web Interface for your browser / phone
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
